# Colab Studio 轻量化模型目录（默认配置）
#
# 如需自定义模型（如切换 KreaNoct_V4 或不同量化版本），请将本文件复制为仓库根目录下的
# `models.toml`（已被 .gitignore 忽略）并修改对应条目。
#
# 字段说明：
#   repo     HuggingFace 仓库 ("owner/name")
#   file     仓库内文件路径（可包含子目录）
#   target   可选；保存在 /content/models/<dir>/ 下的本地文件名（默认取 file 的文件名）
#   dir      ComfyUI models/ 子目录：diffusion_models | text_encoders | vae | loras
#   size_gb  预计体积（GB），用于下载进度估算
#   sha256   可选；64 位十六进制 SHA-256 校验值

# 图片主力工作流（默认）：Krea2-Noct / Noct-Q V4（支持文生图 + 多参考图编辑）
# 也可将 diffusion 替换为 repo = "Noctaluna/Krea2-Noct-Uncensored", file = "KreaNoct_V4_int8_convrot.safetensors"
[image]
diffusion  = { repo = "Noctaluna/Noct-Q", file = "NoctQ_V4_int8_convrot.safetensors",        dir = "diffusion_models", size_gb = 8.1 }
encoder    = { repo = "Noctaluna/Noct-Q", file = "qwen3vl_8b_int8_convrot.safetensors",      dir = "text_encoders",    size_gb = 8.4 }
vae        = { repo = "Noctaluna/Noct-Q", file = "qwen_image_2.1_vae_bf16.safetensors",      dir = "vae",              size_gb = 0.25 }
turbo_lora = { repo = "Noctaluna/Noct-Q", file = "Wuli-Qwen-Image-2512-Turbo-LoRA-2steps-V1.0-bf16.safetensors", dir = "loras", size_gb = 0.7 }

# 图片极速工作流：Z-Image-Turbo NSFW BF16（8 步 CFG=1.0 极速出图）
[image_turbo]
diffusion = { repo = "tewea/z_image_turbo_bf16_nsfw", file = "z_image_turbo_bf16_nsfw_v2.safetensors", dir = "diffusion_models", size_gb = 12.3 }
encoder   = { repo = "Comfy-Org/z_image_turbo",       file = "split_files/text_encoders/qwen_3_4b.safetensors", target = "qwen_3_4b.safetensors", dir = "text_encoders", size_gb = 8.0 }
vae       = { repo = "Comfy-Org/z_image_turbo",       file = "split_files/vae/ae.safetensors",                  target = "zimage-ae.safetensors", dir = "vae",           size_gb = 0.33 }

# 视频工作流 A（默认）：MiniMax-H3（文生视频 / 首尾帧图生视频，带音轨）
[video]
diffusion  = { repo = "Comfy-Org/MiniMax-H3", file = "split_files/diffusion_models/minimax_h3_fl2va_pruned_w6a8.safetensors",        target = "minimax_h3_fl2va_pruned_w6a8.safetensors",            dir = "diffusion_models", size_gb = 18.6 }
encoder    = { repo = "Comfy-Org/MiniMax-H3", file = "split_files/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors",       target = "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors",        dir = "text_encoders",    size_gb = 21.1 }
video_vae  = { repo = "Comfy-Org/MiniMax-H3", file = "split_files/vae/minimax_h3_video_vae_int8_convrot.safetensors",                target = "minimax_h3_video_vae_int8_convrot.safetensors",       dir = "vae",              size_gb = 1.3 }
audio_vae  = { repo = "Comfy-Org/MiniMax-H3", file = "split_files/vae/minimax_h3_audio_vae_fp32.safetensors",                        target = "minimax_h3_audio_vae_fp32.safetensors",               dir = "vae",              size_gb = 0.2 }
turbo_lora = { repo = "Comfy-Org/MiniMax-H3", file = "split_files/loras/minimax_h3_fl2va_turbo_lora_rank128_bf16.safetensors",       target = "minimax_h3_fl2va_turbo_lora_rank128_bf16.safetensors", dir = "loras",            size_gb = 0.8 }

# 视频工作流 B：Wan2.2-Remix A14B High/Low Noise 双阶段 FP8 图生视频/文生视频
[video_wan22]
high_noise = { repo = "FX-FeiHou/wan2.2-Remix",             file = "NSFW/Wan2.2_Remix_NSFW_i2v_14b_high_lighting_v2.0.safetensors",      target = "Wan2.2_Remix_NSFW_i2v_14b_high_lighting_v2.0.safetensors", dir = "diffusion_models", size_gb = 14.3 }
low_noise  = { repo = "FX-FeiHou/wan2.2-Remix",             file = "NSFW/Wan2.2_Remix_NSFW_i2v_14b_low_lighting_v2.0.safetensors",       target = "Wan2.2_Remix_NSFW_i2v_14b_low_lighting_v2.0.safetensors",  dir = "diffusion_models", size_gb = 14.3 }
encoder    = { repo = "Comfy-Org/Wan_2.1_ComfyUI_repackaged", file = "split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors", target = "umt5_xxl_fp8_e4m3fn_scaled.safetensors",                   dir = "text_encoders",    size_gb = 6.7 }
vae        = { repo = "Comfy-Org/Wan_2.1_ComfyUI_repackaged", file = "split_files/vae/wan_2.1_vae.safetensors",                          target = "wan_2.1_vae.safetensors",                                  dir = "vae",              size_gb = 0.25 }
