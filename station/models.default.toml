# Colab Studio 轻量化模型目录（默认配置）
#
# 如需自定义模型（如切换 KreaNoct_V4 或不同量化版本），请将本文件复制为仓库根目录下的
# `models.toml`（已被 .gitignore 忽略）并修改对应条目。
#
# 字段说明：
#   repo     HuggingFace 仓库 ("owner/name")
#   file     仓库内文件路径（可包含子目录）
#   target   可选；保存在 /content/models/<dir>/ 下的本地文件名（默认取 file 的文件名）
#   dir      ComfyUI models/ 子目录：diffusion_models | text_encoders | vae | loras
#   size_gb  预计体积（GB），用于下载进度估算
#   sha256   可选；64 位十六进制 SHA-256 校验值

# 图片主力工作流（默认）：Noct-Q V4（Qwen-Image 2.1 无审查写实微调，支持文生图 + 多参考图编辑）
# 注意：替换 diffusion 时必须选用同属 Qwen-Image 2.1 架构的权重（Krea 2 架构不可直接互换）。
[image]
diffusion  = { repo = "Noctaluna/Noct-Q-Uncensored-Qwen-Image-2.1", file = "NoctQ_V4_int8_convrot.safetensors", dir = "diffusion_models", size_gb = 7.26 }
encoder    = { repo = "Comfy-Org/Qwen-Image-2.1", file = "text_encoders/qwen3vl_8b_int8_convrot.safetensors", dir = "text_encoders", size_gb = 9.351 }
vae        = { repo = "Comfy-Org/Qwen-Image-2.1", file = "vae/qwen_image_2.1_vae_bf16.safetensors", dir = "vae", size_gb = 0.676 }
turbo_lora = { repo = "Comfy-Org/Qwen-Image-2.1", file = "loras/qwen_image_2.1_turbo_lora_avg_rank_178_bf16.safetensors", dir = "loras", size_gb = 0.913 }

# 图片极速工作流：Z-Image-Turbo NSFW BF16（8 步 CFG=1.0 极速出图）
[image_turbo]
diffusion = { repo = "tewea/z_image_turbo_bf16_nsfw", file = "z_image_turbo_bf16_nsfw_v2.safetensors", dir = "diffusion_models", size_gb = 12.566 }
encoder   = { repo = "Comfy-Org/z_image_turbo",       file = "split_files/text_encoders/qwen_3_4b.safetensors", target = "qwen_3_4b.safetensors", dir = "text_encoders", size_gb = 8.045 }
vae       = { repo = "Comfy-Org/z_image_turbo",       file = "split_files/vae/ae.safetensors",                  target = "zimage-ae.safetensors", dir = "vae",           size_gb = 0.335 }

# 视频工作流 A（默认）：MiniMax-H3（文生视频 / 首尾帧图生视频，带音轨）
[video]
diffusion  = { repo = "Comfy-Org/MiniMax-H3", file = "diffusion_models/minimax_h3_fl2va_pruned_w6a8.safetensors", dir = "diffusion_models", size_gb = 16 }
encoder    = { repo = "Comfy-Org/MiniMax-H3", file = "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors", dir = "text_encoders", size_gb = 15.687 }
video_vae  = { repo = "Comfy-Org/MiniMax-H3", file = "vae/minimax_h3_video_vae_int8_convrot.safetensors", dir = "vae", size_gb = 2.811 }
audio_vae  = { repo = "Comfy-Org/MiniMax-H3", file = "vae/minimax_h3_audio_vae_fp32.safetensors", dir = "vae", size_gb = 0.605 }
turbo_lora = { repo = "Comfy-Org/MiniMax-H3", file = "loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors", dir = "loras", size_gb = 1.956 }

# 视频工作流 B：Wan2.2-Remix A14B High/Low Noise 双阶段 FP8 图生视频/文生视频
[video_wan22]
high_noise = { repo = "FX-FeiHou/wan2.2-Remix",             file = "NSFW/Wan2.2_Remix_NSFW_i2v_14b_high_lighting_v2.0.safetensors",      target = "Wan2.2_Remix_NSFW_i2v_14b_high_lighting_v2.0.safetensors", dir = "diffusion_models", size_gb = 14.3 }
low_noise  = { repo = "FX-FeiHou/wan2.2-Remix",             file = "NSFW/Wan2.2_Remix_NSFW_i2v_14b_low_lighting_v2.0.safetensors",       target = "Wan2.2_Remix_NSFW_i2v_14b_low_lighting_v2.0.safetensors",  dir = "diffusion_models", size_gb = 14.3 }
encoder    = { repo = "Comfy-Org/Wan_2.1_ComfyUI_repackaged", file = "split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors", target = "umt5_xxl_fp8_e4m3fn_scaled.safetensors",                   dir = "text_encoders",    size_gb = 6.7 }
vae        = { repo = "Comfy-Org/Wan_2.1_ComfyUI_repackaged", file = "split_files/vae/wan_2.1_vae.safetensors",                          target = "wan_2.1_vae.safetensors",                                  dir = "vae",              size_gb = 0.25 }
